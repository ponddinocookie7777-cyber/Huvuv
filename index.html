const particles=new THREE.Group();scene.add(particles);for(let i=0;i<100;i++){const s=mesh(new THREE.SphereGeometry(.012+Math.random()*.012,6,6),new THREE.MeshBasicMaterial({color:i%3===0?0xf0c875:0x8293a5,transparent:true,opacity:.24}),particles,[ (Math.random()-.5)*12,Math.random()*5,(Math.random()-.5)*12]);s.userData.phase=Math.random()*6}
let state={coins:1250,wins:0,losses:0,rounds:0,streak:0,last:'',daily:150,owned:[],mode:'solo',hp:[4,4],turn:1,ammo:[],index:0,active:false,finished:false,round:1,prize:160};

function save(){localStorage.setItem('lc3dSave',JSON.stringify(state));$('coins').textContent='◈ '+state.coins.toLocaleString();$('dailytext').textContent=state.last===dayKey()?'수령 완료':'◈ '+state.daily+' 크레딧'}
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function updateHud(){const playerTurn=state.turn===1;$('turnlabel').textContent=!state.active?'TABLE / FREE LOOK':playerTurn?'YOUR TURN':state.mode==='solo'?'DEALER THINKING':'PLAYER 2 TURN';$('roundlabel').textContent='ROUND '+String(state.round).padStart(2,'0');$('hp').innerHTML=Array.from({length:4},(_,i)=>`<i class="heart ${i>=state.hp[0]?'off':''}"></i>`).join('');$('hptext').textContent=`PLAYER 1 · ${state.hp[0]} HP  /  ${state.mode==='solo'?'DEALER':'PLAYER 2'} · ${state.hp[1]} HP`;$('ammotext').textContent=state.active?`${state.ammo.length-state.index}발 남음`:'탄창 대기';$('ammo').innerHTML=state.ammo.map((b,i)=>`<i class="bullet ${i<state.index?'used':i>state.index?'unknown':''}" title="${i===state.index?(b?'실탄':'공포탄'):'미확인'}"></i>`).join('');const can=state.active&&!state.finished&&state.turn===1;$('enemy').disabled=!can;$('self').disabled=!can;$('roundbtn').disabled=state.active&&!state.finished;$('roundbtn').innerHTML=state.finished?'다음 매치<span>체력 회복</span>':'라운드 시작<span>새 탄창 장전</span>';save()}
function msg(s){$('message').textContent=s}
function openModal(title,body,buttons){$('modal').innerHTML=`<h2>${title}</h2><p>${body}</p><div class="modalrow">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;$('modalwrap').classList.add('open');$('modal').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const fn=buttons[i].fn;$('modalwrap').classList.remove('open');if(fn)fn()})}
function openMenu(type){if(type==='profile'){openModal('PLAYER DOSSIER',`승리 ${state.wins} · 패배 ${state.losses} · 라운드 ${state.rounds}<br>보유 크레딧 ◈ ${state.coins}<br>해금 아이템 ${state.owned.length}/3`,[{label:'닫기'},{label:'초기화',cls:'danger',fn:()=>openModal('데이터 초기화','기록과 코인이 모두 삭제됩니다.',[{label:'취소',cls:'ghost'},{label:'초기화',cls:'danger',fn:()=>{localStorage.removeItem('lc3dSave');location.reload()}}])}])}else{const items=[{id:'neon',name:'NEON TABLE',price:450,desc:'테이블 네온 링'},{id:'gold',name:'GOLD DEALER',price:700,desc:'딜러 골드 액센트'},{id:'ace',name:'THE ACE',price:950,desc:'프로필 전용 타이틀'}];openModal('BLACK MARKET','크레딧으로 컬렉션을 해금하세요.'+items.map(it=>`<div class="listitem"><span class="ico">◇</span><span class="info"><b>${it.name}</b><small>${it.desc}</small></span><button class="btn ${state.owned.includes(it.id)?'ghost':'gold'}" ${state.owned.includes(it.id)?'disabled':''} data-buy="${it.id}">${state.owned.includes(it.id)?'보유':'◈ '+it.price}</button></div>`).join(''),[{label:'닫기'}]);$('modal').querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>{const it=items.find(x=>x.id===btn.dataset.buy);if(state.coins<it.price){msg('크레딧이 부족합니다.');return}state.coins-=it.price;state.owned.push(it.id);save();openMenu('shop')})}}
function startGame(mode){sound('reload');state.mode=mode;state.hp=[4,4];state.round=1;state.active=false;state.finished=false;$('intro').style.opacity='0';$('intro').style.pointerEvents='none';dealer.visible=true;player.visible=true;msg(mode==='solo'?'딜러가 당신을 기다립니다.':'두 플레이어가 한 기기를 공유합니다.');updateHud();target.set(0,1.1,0)}
function nextRound(){if(state.active&&!state.finished)return;if(state.finished){state.hp=[4,4];state.round++;state.finished=false}sound('reload');reloadAnim=1;reloadCartridges.forEach((c,i)=>{c.visible=true;c.position.set(-.03+i*.022,.03,-.12);c.userData.slot=i});state.ammo=Array.from({length:4+Math.floor(Math.random()*3)},()=>Math.random()<.48);if(!state.ammo.includes(true))state.ammo[0]=true;if(!state.ammo.includes(false)&&state.ammo.length>1)state.ammo[state.ammo.length-1]=false;state.index=0;state.turn=1;state.active=true;state.prize=Math.round((120+state.ammo.length*20));msg('탄창이 장전되었습니다. 행동을 선택하세요.');updateHud();prop.rotation.y+=.6}
function shot(which){if(!state.active||state.finished||state.turn!==1)return;performShot(1,which);if(state.active&&state.mode==='solo'&&state.turn===2)setTimeout(aiTurn,900)}
function performShot(who,which){sound('shot');recoil=1;shotFlash=1;muzzleLight.intensity=32;setTimeout(()=>muzzleLight.intensity=0,75);cylinderGroup.rotation.z+=Math.PI/3;const bullet=state.ammo[state.index++];const victim=which==='self'?who:who===1?2:1;const live=bullet;msg((who===1?'당신':'딜러')+'이(가) '+(which==='self'?'자신에게':'상대에게')+' 발사. '+(live?'실탄! 피해 1.':'공포탄. 피해 없음.'));prop.rotation.z=0.5;setTimeout(()=>prop.rotation.z=0,350);
if(live){state.hp[victim-1]=Math.max(0,state.hp[victim-1]-1);flash(victim)}if(state.hp[victim-1]<=0){finish(who);return}if(state.index>=state.ammo.length){state.active=false;msg('탄창이 비었습니다. 새 라운드를 시작하세요.');updateHud();return}state.turn=which==='self'&&!live?who:who===1?2:1;updateHud()}
function flash(n){const l=new THREE.PointLight(0xff493c,40,7);l.position.set(0,1.8,n===1?-2.8:2.8);scene.add(l);setTimeout(()=>scene.remove(l),180);hitReact=1;if(n===1){playerRig.mouth.scale.y=2.5}else{dealerRig.mouth.scale.y=2.5}}
function aiTurn(){if(!state.active||state.turn!==2)return;const remaining=state.ammo.slice(state.index);const p=remaining.filter(Boolean).length/Math.max(1,remaining.length);performShot(2,p<.35?'self':'enemy')}
function finish(who){state.active=false;state.finished=true;state.rounds++;if(who===1){state.wins++;state.coins+=state.prize;msg('승리! ◈ '+state.prize+' 크레딧 획득.')}else{state.losses++;msg('패배. 다음 매치에서 다시 도전하세요.')}updateHud();openModal(who===1?'YOU SURVIVED':'TABLE LOST',who===1?'상대를 제압했습니다. ◈ '+state.prize+' 크레딧이 지급되었습니다.':'이번 매치는 패배했습니다. 크레딧은 잃지 않았습니다.',[{label:'다시 플레이',cls:'gold',fn:()=>{state.hp=[4,4];state.finished=false;updateHud()}}])}
function daily(){sound('ui');if(state.last===dayKey()){openModal('DAILY CONTRACT','오늘 보상은 이미 수령했습니다. 내일 다시 방문하세요.',[{label:'확인'}]);return}state.streak=state.streak||0;state.streak++;const bonus=Math.min(10*state.streak,100);const amount=state.daily+bonus;state.coins+=amount;state.last=dayKey();save();openModal('REWARD CLAIMED',`◈ ${amount} 크레딧 획득! 기본 ${state.daily} + 연속 출석 보너스 ${bonus}.`,[{label:'좋아',cls:'gold'}])}
let lastX=0,lastY=0,pointers=new Map();

renderer.domElement.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<8){if(state.active){msg(state.mode==='solo'?'딜러를 바라보고 있습니다. 아래 버튼으로 행동을 선택하세요.':'테이블을 터치했습니다. 아래 버튼으로 행동을 선택하세요.')}else{msg('테이블을 둘러보고 라운드 시작을 눌러주세요.')}}drag=null;pointers.delete(e.pointerId)});renderer.domElement.addEventListener('pointercancel',()=>drag=null);

function frame(t){requestAnimationFrame(frame);const time=t*.001;
